version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: lumo-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lumo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumo_dev}
      POSTGRES_DB: ${POSTGRES_DB:-lumo}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lumo-network

  redis:
    image: redis:7-alpine
    container_name: lumo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lumo-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  lumo-network:
    driver: bridge
