# Lumo Configuration File
# Copy this file to ~/.lumo/config.yaml or ./config.yaml and customize as needed

# SSH Configuration
ssh:
  # Connection timeout for SSH operations
  timeout: 30s

  # Default SSH port
  port: 22

  # Keep-alive interval to prevent connection drops
  keepalive: 30s

  # Maximum number of retry attempts for failed connections
  max_retries: 3

  # Interval between retry attempts
  retry_interval: 5s

  # Path to SSH known_hosts file (leave empty for default ~/.ssh/known_hosts)
  known_hosts_path: ""

  # Enable strict host key checking (verify server fingerprints)
  strict_host_key_checking: false

  # Preferred authentication methods in order of priority
  # Options: agent, key, password, interactive
  preferred_auth_methods:
    - agent        # Try SSH agent first
    - key          # Then SSH key files
    - password     # Then password auth
    - interactive  # Finally keyboard-interactive

  # Default timeout for command execution
  command_timeout: 5m

  # Default SSH private key path (leave empty to auto-discover in ~/.ssh/)
  # Will try id_ed25519, id_ecdsa, id_rsa, id_dsa in order
  default_key_path: ""

# AI Provider Configuration
ai:
  # Enable AI-powered analysis (set to false to disable)
  enabled: true

  # Primary AI provider: anthropic, openai, ollama, gemini, or openrouter
  provider: anthropic

  # API key: DO NOT set here! Use environment variable instead:
  #   export LUMO_AI_API_KEY=your-api-key
  # (REQUIRED for anthropic/openai/gemini, not needed for ollama)

  # Model to use (leave empty to use provider defaults)
  # This overrides the provider-specific model from the models map
  model: ""

  # Model names for each provider (used when 'model' is empty)
  models:
    anthropic: claude-sonnet-4-5-20250929
    openai: gpt-4-turbo-preview
    ollama: llama3.1:8b
    gemini: gemini-2.0-flash-exp
    openrouter: anthropic/claude-sonnet-4.5  # OpenRouter provides access to multiple models

  # Custom API endpoint (optional, leave empty for defaults)
  # Examples:
  #   - Ollama: http://localhost:11434/api/chat
  #   - Custom OpenAI: https://your-proxy.com/v1/chat/completions
  endpoint: ""

  # Timeout for AI API calls
  timeout: 120s

  # Maximum retry attempts for failed AI API calls
  max_retries: 3

  # Temperature controls randomness (0.0 = deterministic, 1.0 = creative)
  # Range: 0.0 to 1.0
  temperature: 1.0

  # Maximum tokens in AI response
  max_tokens: 4096

  # Reasoning effort for OpenAI reasoning models (o1, o3, gpt-5-nano series)
  # Controls how much reasoning the model uses before generating the response
  # Options: low, medium, high
  # - low: Minimal reasoning, faster responses, lower token usage (~1k-2k reasoning tokens)
  # - medium: Balanced reasoning and speed (~2k-4k reasoning tokens)
  # - high: Maximum reasoning, slower but more thorough (~4k-8k reasoning tokens)
  # Default: empty (uses OpenAI's default, typically "medium")
  # Note: Only affects OpenAI reasoning models, ignored by other providers
  reasoning_effort: ""

# Logging Configuration
logging:
  # Log level: debug, info, warn, error
  level: info

  # Log format: text or json
  format: text

  # Log output: stdout, stderr, or file path
  output: stdout

# API Server Configuration
api:
  # Port for the API server
  port: 8080

  # Host to bind the API server to
  host: 0.0.0.0

  # Enable TLS/HTTPS
  tls: false

  # Path to TLS certificate file (required if tls is true)
  cert_file: ""

  # Path to TLS private key file (required if tls is true)
  key_file: ""

  # Read timeout for API requests
  read_timeout: 15s

  # Write timeout for API responses
  write_timeout: 15s

  # Maximum number of concurrent connections
  max_connections: 100

# Diagnostics Configuration
diagnostics:
  # Network diagnostic settings
  network:
    # Network targets to test connectivity to
    # Each target will be tested from the diagnosed server
    targets:
      # ICMP ping test to Google DNS
      - host: 8.8.8.8
        port: 0           # Port 0 means ICMP-only (no TCP connection test)
        protocol: icmp

      # DNS resolution test
      - host: google.com
        port: 0
        protocol: icmp

      # Example: Test database connectivity
      # - host: database.internal
      #   port: 5432
      #   protocol: tcp

      # Example: Test API server connectivity
      # - host: api.service.com
      #   port: 443
      #   protocol: tcp

      # Example: Test Redis cache
      # - host: cache.internal
      #   port: 6379
      #   protocol: tcp

      # Example: Test custom service with DNS name
      # - host: myservice.example.com
      #   port: 8080
      #   protocol: tcp

  # Security diagnostic settings
  security:
    # Port checking configuration
    port_check:
      # List of ports that are expected/allowed (won't trigger warnings)
      # Common ports: 22 (SSH), 80 (HTTP), 443 (HTTPS), 3000, 8080 (dev servers)
      whitelisted_ports:
        - 22
        - 80
        - 443
        - 3000
        - 8080

    # Authentication failure monitoring
    auth_failure_check:
      # How many hours to look back for failed auth attempts
      lookback_hours: 1

      # Warning threshold for failed authentication attempts
      # If failures exceed this in lookback window, a warning is raised
      failure_threshold: 20

  # Kubernetes cluster diagnostic settings
  kubernetes:
    # Enable Kubernetes cluster diagnostics
    # When enabled, lumo will diagnose Kubernetes cluster health using native client
    # Requires access to a valid kubeconfig file
    enabled: false

    # Path to kubeconfig file (leave empty for default ~/.kube/config)
    kubeconfig_path: ""

    # Kubernetes context to use (leave empty for current context)
    context: ""

    # Namespaces to check (empty list = check all namespaces)
    # Examples: ["default", "kube-system", "production"]
    namespaces: []

    # Node health checks
    check_nodes: true

    # Pod health checks
    check_pods: true

    # Deployment health checks
    check_deployments: true

    # StatefulSet health checks
    check_statefulsets: true

    # DaemonSet health checks
    check_daemonsets: true

    # Service endpoint checks
    check_services: true

    # PersistentVolumeClaim checks
    check_pvcs: true

    # Recent event monitoring
    check_events: true

    # How many minutes to look back for Kubernetes events
    event_lookback_mins: 30

# Environment variables can override these settings:
# SSH:
#   LUMO_SSH_PORT=2222
#   LUMO_SSH_STRICT_HOST_KEY_CHECKING=true
#   LUMO_SSH_DEFAULT_KEY_PATH=~/.ssh/id_ed25519
#
# AI - Provider-specific API keys (recommended - allows switching providers without changing keys):
#   LUMO_ANTHROPIC_API_KEY=sk-ant-...   # Anthropic Claude API key
#   LUMO_OPENAI_API_KEY=sk-...          # OpenAI GPT API key
#   LUMO_GEMINI_API_KEY=...             # Google Gemini API key
#   LUMO_OLLAMA_API_KEY=...             # Ollama API key (usually not needed for local)
#   LUMO_OPENROUTER_API_KEY=sk-or-...   # OpenRouter API key (unified access to multiple LLMs)
#
# AI - Generic fallback (works but requires changing when switching providers):
#   LUMO_AI_API_KEY=sk-...              # Generic API key (fallback if provider-specific not set)
#
# AI - Other settings:
#   LUMO_AI_ENABLED=true                # Override enabled setting
#   LUMO_AI_PROVIDER=openai             # Override provider
#   LUMO_AI_MODEL=gpt-4                 # Override model
#   LUMO_AI_ENDPOINT=http://...         # Override endpoint
#   LUMO_AI_TEMPERATURE=0.7             # Override temperature
#   LUMO_AI_MAX_TOKENS=2048             # Override max tokens
#   LUMO_AI_REASONING_EFFORT=low        # Override reasoning effort (for OpenAI reasoning models)
#
# Logging:
#   LUMO_LOGGING_LEVEL=debug
#   LUMO_LOGGING_FORMAT=json
#
# Kubernetes:
#   LUMO_DIAGNOSTICS_KUBERNETES_ENABLED=true
#   LUMO_DIAGNOSTICS_KUBERNETES_KUBECONFIG_PATH=/path/to/kubeconfig
#   LUMO_DIAGNOSTICS_KUBERNETES_CONTEXT=my-cluster
#   LUMO_DIAGNOSTICS_KUBERNETES_EVENT_LOOKBACK_MINS=60
