# Lumo Notifications Configuration Example
#
# This file demonstrates how to configure notifications for Lumo.
# Copy sections to your config.yaml and customize with your credentials.
#
# SECURITY: Always use environment variables for sensitive data like API tokens,
# webhook URLs, and passwords. Never commit credentials to version control.

notifications:
  enabled: true
  notifiers:
    # ============================================================================
    # Slack Webhook Integration
    # ============================================================================
    # Get your webhook URL from: https://api.slack.com/messaging/webhooks
    - name: ops-slack
      type: slack
      enabled: true
      webhook_url: ${SLACK_WEBHOOK_URL}  # Set via environment variable
      timeout: 30  # seconds

    # ============================================================================
    # Telegram Bot Integration
    # ============================================================================
    # 1. Create bot via @BotFather: https://t.me/BotFather
    # 2. Get chat ID via @userinfobot: https://t.me/userinfobot
    # 3. For groups: Add bot to group, then get group chat ID (negative number)
    - name: alerts-telegram
      type: telegram
      enabled: true
      bot_token: ${TELEGRAM_BOT_TOKEN}  # From @BotFather
      chat_id: ${TELEGRAM_CHAT_ID}      # Your chat ID or group ID (e.g., -1001234567890)
      timeout: 30

    # ============================================================================
    # Discord Webhook Integration
    # ============================================================================
    # Get webhook URL from: Server Settings → Integrations → Webhooks
    - name: discord-alerts
      type: webhook
      enabled: true
      webhook_url: ${DISCORD_WEBHOOK_URL}  # https://discord.com/api/webhooks/...
      timeout: 30

    # ============================================================================
    # Microsoft Teams Webhook Integration
    # ============================================================================
    # Get webhook URL from: Team Settings → Connectors → Incoming Webhook
    - name: teams-notifications
      type: webhook
      enabled: true
      webhook_url: ${TEAMS_WEBHOOK_URL}  # https://outlook.office.com/webhook/...
      timeout: 30

    # ============================================================================
    # Generic Custom Webhook
    # ============================================================================
    # Send notifications to any HTTP endpoint with custom headers
    - name: custom-webhook
      type: webhook
      enabled: false  # Disabled by default
      webhook_url: https://your-api.example.com/webhook
      method: POST  # GET, POST, PUT, DELETE, etc.
      headers:
        Authorization: Bearer ${WEBHOOK_TOKEN}
        X-Custom-Header: custom-value
      timeout: 30

    # ============================================================================
    # Email (SMTP) Integration
    # ============================================================================
    # Gmail Example:
    # 1. Enable 2FA: https://myaccount.google.com/security
    # 2. Generate App Password: https://myaccount.google.com/apppasswords
    # 3. Use the generated password as SMTP_PASSWORD
    - name: email-alerts
      type: email
      enabled: true
      smtp_host: smtp.gmail.com
      smtp_port: 587
      smtp_user: your-email@gmail.com
      smtp_pass: ${SMTP_PASSWORD}  # App Password for Gmail
      from: lumo-alerts@example.com
      to:
        - ops-team@example.com
        - admin@example.com
        - oncall@example.com
      use_tls: true  # Always use TLS for security
      timeout: 30

    # ============================================================================
    # Additional Email Examples
    # ============================================================================

    # Outlook/Office 365
    - name: outlook-email
      type: email
      enabled: false
      smtp_host: smtp-mail.outlook.com
      smtp_port: 587
      smtp_user: your-email@outlook.com
      smtp_pass: ${OUTLOOK_PASSWORD}
      from: lumo-alerts@outlook.com
      to:
        - team@example.com
      use_tls: true
      timeout: 30

    # SendGrid
    - name: sendgrid-email
      type: email
      enabled: false
      smtp_host: smtp.sendgrid.net
      smtp_port: 587
      smtp_user: apikey  # Username is literally "apikey"
      smtp_pass: ${SENDGRID_API_KEY}
      from: alerts@yourdomain.com
      to:
        - team@example.com
      use_tls: true
      timeout: 30

    # AWS SES (US East 1)
    - name: aws-ses-email
      type: email
      enabled: false
      smtp_host: email-smtp.us-east-1.amazonaws.com
      smtp_port: 587
      smtp_user: ${AWS_SES_SMTP_USER}
      smtp_pass: ${AWS_SES_SMTP_PASSWORD}
      from: alerts@yourdomain.com
      to:
        - team@example.com
      use_tls: true
      timeout: 30

# ============================================================================
# Environment Variables Setup
# ============================================================================
#
# Create a .env file or export these variables:
#
# # Slack
# export SLACK_WEBHOOK_URL=https://hooks.slack.com/services/YOUR/WEBHOOK/URL
#
# # Telegram
# export TELEGRAM_BOT_TOKEN=1234567890:ABCdefGHIjklMNOpqrsTUVwxyz
# export TELEGRAM_CHAT_ID=-1001234567890
#
# # Discord
# export DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/YOUR_ID/YOUR_TOKEN
#
# # Microsoft Teams
# export TEAMS_WEBHOOK_URL=https://outlook.office.com/webhook/YOUR_WEBHOOK_URL
#
# # Email (Gmail)
# export SMTP_PASSWORD=your-app-password
#
# # Custom Webhook
# export WEBHOOK_TOKEN=your-bearer-token
#
