name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v1.0.0, v0.9.2, etc.

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux builds
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
          # macOS builds
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          # Windows builds
          - goos: windows
            goarch: amd64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.4'
        cache: true

    - name: Get version from tag
      id: get_version
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Download dependencies
      run: go mod download

    - name: Build binaries
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        VERSION: ${{ steps.get_version.outputs.version }}
      run: |
        # Set binary extension for Windows
        EXT=""
        if [ "$GOOS" = "windows" ]; then
          EXT=".exe"
        fi

        # Build with version info
        LDFLAGS="-s -w -X main.version=$VERSION -X main.commit=${{ github.sha }} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

        # Build lumo CLI
        echo "Building lumo CLI for $GOOS/$GOARCH..."
        CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o "lumo-$GOOS-$GOARCH$EXT" ./cmd/lumo

        # Build lumo-agent
        echo "Building lumo-agent for $GOOS/$GOARCH..."
        CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o "lumo-agent-$GOOS-$GOARCH$EXT" ./cmd/lumo-agent

        # Create archives
        if [ "$GOOS" = "windows" ]; then
          # Windows: create zip
          zip "lumo-$VERSION-$GOOS-$GOARCH.zip" "lumo-$GOOS-$GOARCH$EXT" "lumo-agent-$GOOS-$GOARCH$EXT" LICENSE README.md
          ARCHIVE="lumo-$VERSION-$GOOS-$GOARCH.zip"
        else
          # Unix: create tar.gz
          tar czf "lumo-$VERSION-$GOOS-$GOARCH.tar.gz" "lumo-$GOOS-$GOARCH$EXT" "lumo-agent-$GOOS-$GOARCH$EXT" LICENSE README.md
          ARCHIVE="lumo-$VERSION-$GOOS-$GOARCH.tar.gz"
        fi

        # Generate checksums
        sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
        md5sum "$ARCHIVE" > "$ARCHIVE.md5"

        # List created files
        ls -lh lumo-* *.sha256 *.md5

    - name: Extract release notes
      id: release_notes
      run: |
        VERSION=${{ steps.get_version.outputs.version }}

        # Extract version from CHANGELOG.md if it exists
        if [ -f CHANGELOG.md ]; then
          # Get content between this version and previous version
          NOTES=$(awk "/^## \[$VERSION\]/,/^## \[/" CHANGELOG.md | sed '1d;$d' || echo "")
          if [ -z "$NOTES" ]; then
            NOTES="Release $VERSION - See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/$VERSION/CHANGELOG.md) for details."
          fi
        else
          NOTES="Release $VERSION"
        fi

        # Save to file to preserve formatting
        echo "$NOTES" > /tmp/release_notes.md

        # Also output for display
        echo "Release notes:"
        cat /tmp/release_notes.md

    - name: Upload Release Assets
      uses: softprops/action-gh-release@v2
      with:
        body_path: /tmp/release_notes.md
        files: |
          lumo-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
          lumo-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
          lumo-${{ steps.get_version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.zip' || '.tar.gz' }}
          lumo-${{ steps.get_version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.zip' || '.tar.gz' }}.sha256
          lumo-${{ steps.get_version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.zip' || '.tar.gz' }}.md5
        draft: false
        prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  generate-combined-checksums:
    name: Generate Combined Checksums
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get version from tag
      id: get_version
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Download all release assets
      run: |
        gh release download ${{ steps.get_version.outputs.version }} --pattern "*.tar.gz" --pattern "*.zip" --dir downloads
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate combined checksums
      working-directory: downloads
      run: |
        # Generate combined SHA256 checksums
        sha256sum *.tar.gz *.zip 2>/dev/null > SHA256SUMS.txt || true

        # Generate combined MD5 checksums
        md5sum *.tar.gz *.zip 2>/dev/null > MD5SUMS.txt || true

        echo "SHA256 checksums:"
        cat SHA256SUMS.txt
        echo ""
        echo "MD5 checksums:"
        cat MD5SUMS.txt

    - name: Upload combined checksums
      uses: softprops/action-gh-release@v2
      with:
        files: |
          downloads/SHA256SUMS.txt
          downloads/MD5SUMS.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
