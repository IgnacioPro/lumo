name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v1.0.0, v0.9.2, etc.

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get version from tag
      id: get_version
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Generate release notes
      id: release_notes
      run: |
        VERSION=${GITHUB_REF#refs/tags/}

        # Extract version from CHANGELOG.md if it exists
        if [ -f CHANGELOG.md ]; then
          # Get content between this version and previous version
          NOTES=$(awk "/^## \[$VERSION\]/,/^## \[/" CHANGELOG.md | sed '1d;$d' || echo "")
          if [ -z "$NOTES" ]; then
            NOTES="Release $VERSION - See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/$VERSION/CHANGELOG.md) for details."
          fi
        else
          NOTES="Release $VERSION"
        fi

        # Save to file to preserve formatting
        echo "$NOTES" > /tmp/release_notes.md

        # Also output for display
        echo "Release notes:"
        cat /tmp/release_notes.md

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        release_name: Release ${{ github.ref_name }}
        body_path: /tmp/release_notes.md
        draft: false
        prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}

  build-and-upload:
    name: Build and Upload
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux builds
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
          # macOS builds
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          # Windows builds
          - goos: windows
            goarch: amd64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.4'
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Build binaries
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        VERSION: ${{ needs.create-release.outputs.version }}
      run: |
        # Set binary extension for Windows
        EXT=""
        if [ "$GOOS" = "windows" ]; then
          EXT=".exe"
        fi

        # Build with version info
        LDFLAGS="-s -w -X main.version=$VERSION -X main.commit=${{ github.sha }} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

        # Build lumo CLI
        echo "Building lumo CLI for $GOOS/$GOARCH..."
        CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o "lumo-$GOOS-$GOARCH$EXT" ./cmd/lumo

        # Build lumo-agent
        echo "Building lumo-agent for $GOOS/$GOARCH..."
        CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o "lumo-agent-$GOOS-$GOARCH$EXT" ./cmd/lumo-agent

        # Create archives
        if [ "$GOOS" = "windows" ]; then
          # Windows: create zip
          zip "lumo-$VERSION-$GOOS-$GOARCH.zip" "lumo-$GOOS-$GOARCH$EXT" "lumo-agent-$GOOS-$GOARCH$EXT" LICENSE README.md
          ARCHIVE="lumo-$VERSION-$GOOS-$GOARCH.zip"
        else
          # Unix: create tar.gz
          tar czf "lumo-$VERSION-$GOOS-$GOARCH.tar.gz" "lumo-$GOOS-$GOARCH$EXT" "lumo-agent-$GOOS-$GOARCH$EXT" LICENSE README.md
          ARCHIVE="lumo-$VERSION-$GOOS-$GOARCH.tar.gz"
        fi

        # Generate checksums
        sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
        md5sum "$ARCHIVE" > "$ARCHIVE.md5"

        # List created files
        ls -lh lumo-* *.sha256 *.md5

    - name: Upload CLI binary
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./lumo-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
        asset_name: lumo-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
        asset_content_type: application/octet-stream

    - name: Upload Agent binary
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./lumo-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
        asset_name: lumo-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
        asset_content_type: application/octet-stream

    - name: Upload Archive
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./lumo-${{ needs.create-release.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.zip' || '.tar.gz' }}
        asset_name: lumo-${{ needs.create-release.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.zip' || '.tar.gz' }}
        asset_content_type: ${{ matrix.goos == 'windows' && 'application/zip' || 'application/gzip' }}

    - name: Upload SHA256 checksum
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./lumo-${{ needs.create-release.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.zip' || '.tar.gz' }}.sha256
        asset_name: lumo-${{ needs.create-release.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.zip' || '.tar.gz' }}.sha256
        asset_content_type: text/plain

    - name: Upload MD5 checksum
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./lumo-${{ needs.create-release.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.zip' || '.tar.gz' }}.md5
        asset_name: lumo-${{ needs.create-release.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.zip' || '.tar.gz' }}.md5
        asset_content_type: text/plain

  generate-checksums:
    name: Generate Combined Checksums
    needs: [create-release, build-and-upload]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all release assets
      uses: robinraju/release-downloader@v1
      with:
        tag: ${{ needs.create-release.outputs.version }}
        fileName: "*.tar.gz"
        out-file-path: "downloads"

    - name: Download Windows assets
      uses: robinraju/release-downloader@v1
      with:
        tag: ${{ needs.create-release.outputs.version }}
        fileName: "*.zip"
        out-file-path: "downloads"

    - name: Generate combined checksums
      working-directory: downloads
      run: |
        # Generate combined SHA256 checksums
        sha256sum *.tar.gz *.zip > SHA256SUMS.txt

        # Generate combined MD5 checksums
        md5sum *.tar.gz *.zip > MD5SUMS.txt

        echo "SHA256 checksums:"
        cat SHA256SUMS.txt
        echo ""
        echo "MD5 checksums:"
        cat MD5SUMS.txt

    - name: Upload combined SHA256 checksums
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./downloads/SHA256SUMS.txt
        asset_name: SHA256SUMS.txt
        asset_content_type: text/plain

    - name: Upload combined MD5 checksums
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./downloads/MD5SUMS.txt
        asset_name: MD5SUMS.txt
        asset_content_type: text/plain
