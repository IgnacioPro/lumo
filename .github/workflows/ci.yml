name: CI

# Temporarily disabled - using CircleCI instead
# To re-enable, remove the "if: false" condition from all jobs below

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/**'

jobs:
  test:
    name: Test & Build
    runs-on: self-hosted
    if: false  # Disabled - using CircleCI instead

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.4'
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Run linters
      uses: golangci/golangci-lint-action@v8
      with:
        version: latest
        install-mode: binary
        args: --timeout=5m

    - name: Vulnerability check
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...

    - name: Run tests
      run: make ci-test

    - name: Build binaries
      run: make ci-build

  build-cross-platform:
    name: Build (Cross-Platform)
    # Only run cross-platform builds on main/master or PRs to main/master
    if: false  # Disabled - using CircleCI instead
    runs-on: self-hosted
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.4'
        cache: true

    - name: Build CLI
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: go build -v -o lumo-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/lumo

    - name: Build Agent
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: go build -v -o lumo-agent-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/lumo-agent
