name: CI

on:
  push:
    branches: [ main, master, develop, 'claude/**' ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for git diff

    - name: Get changed files
      id: changed-files
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
        else
          # For push events, compare with previous commit
          BASE_SHA="${{ github.event.before }}"
          HEAD_SHA="${{ github.sha }}"
        fi

        # Get all changed Go files
        CHANGED_GO_FILES=$(git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$HEAD_SHA" | grep '\.go$' || true)
        echo "changed_go_files<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGED_GO_FILES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

        # Get unique packages from changed files
        CHANGED_PACKAGES=$(echo "$CHANGED_GO_FILES" | xargs -r dirname | sort -u | sed 's|^|./|' | tr '\n' ' ')
        echo "changed_packages=$CHANGED_PACKAGES" >> $GITHUB_OUTPUT

        # Check if any Go files changed
        if [ -n "$CHANGED_GO_FILES" ]; then
          echo "has_go_changes=true" >> $GITHUB_OUTPUT
        else
          echo "has_go_changes=false" >> $GITHUB_OUTPUT
        fi

        echo "Changed Go files:"
        echo "$CHANGED_GO_FILES"
        echo ""
        echo "Changed packages: $CHANGED_PACKAGES"

    - name: Set up Go
      if: steps.changed-files.outputs.has_go_changes == 'true'
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache: true

    - name: Download dependencies
      if: steps.changed-files.outputs.has_go_changes == 'true'
      run: go mod download

    - name: Verify dependencies
      if: steps.changed-files.outputs.has_go_changes == 'true'
      run: go mod verify

    - name: Check formatting
      if: steps.changed-files.outputs.has_go_changes == 'true'
      run: |
        CHANGED_FILES="${{ steps.changed-files.outputs.changed_go_files }}"
        if [ -z "$CHANGED_FILES" ]; then
          echo "No Go files changed, skipping format check"
          exit 0
        fi

        UNFORMATTED=$(echo "$CHANGED_FILES" | xargs gofmt -l 2>/dev/null || true)
        if [ -n "$UNFORMATTED" ]; then
          echo "The following changed files are not formatted:"
          echo "$UNFORMATTED"
          echo ""
          echo "Formatting diff:"
          echo "$UNFORMATTED" | xargs gofmt -d
          exit 1
        fi
        echo "All changed Go files are properly formatted"

    - name: Run go vet
      if: steps.changed-files.outputs.has_go_changes == 'true'
      run: |
        PACKAGES="${{ steps.changed-files.outputs.changed_packages }}"
        if [ -z "$PACKAGES" ]; then
          echo "No packages changed, skipping go vet"
          exit 0
        fi
        echo "Running go vet on changed packages: $PACKAGES"
        go vet $PACKAGES

    - name: Run tests on changed packages
      if: steps.changed-files.outputs.has_go_changes == 'true'
      run: |
        PACKAGES="${{ steps.changed-files.outputs.changed_packages }}"
        if [ -z "$PACKAGES" ]; then
          echo "No packages changed, skipping tests"
          exit 0
        fi
        echo "Running tests on changed packages: $PACKAGES"
        go test -timeout=2m $PACKAGES

    - name: Build
      if: steps.changed-files.outputs.has_go_changes == 'true'
      run: go build -v ./cmd/lumo

    - name: Skip CI
      if: steps.changed-files.outputs.has_go_changes == 'false'
      run: echo "No Go files changed, skipping CI checks"

  build-cross-platform:
    name: Build (Cross-Platform)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for git diff

    - name: Check for Go file changes
      id: go-changes
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
        else
          BASE_SHA="${{ github.event.before }}"
          HEAD_SHA="${{ github.sha }}"
        fi

        CHANGED_GO_FILES=$(git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$HEAD_SHA" | grep '\.go$' || true)
        if [ -n "$CHANGED_GO_FILES" ]; then
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "Go files changed, will run cross-platform builds"
        else
          echo "has_changes=false" >> $GITHUB_OUTPUT
          echo "No Go files changed, skipping cross-platform builds"
        fi

    - name: Set up Go
      if: steps.go-changes.outputs.has_changes == 'true'
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache: true

    - name: Build
      if: steps.go-changes.outputs.has_changes == 'true'
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: go build -v -o lumo-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/lumo

    - name: Skip build
      if: steps.go-changes.outputs.has_changes == 'false'
      run: echo "No Go files changed, skipping cross-platform build for ${{ matrix.goos }}-${{ matrix.goarch }}"
