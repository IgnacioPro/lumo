openapi: 3.0.3
info:
  title: Lumo API
  description: |
    Lumo API Server for distributed SRE/DevOps automation.

    The Lumo API provides endpoints for:
    - Agent registration and management
    - Diagnostic job submission and tracking
    - Health and readiness checks

    ## Authentication

    All authenticated endpoints require an API key passed via:
    - `X-API-Key` header, or
    - `Authorization: Bearer <api-key>` header

    ## Rate Limiting

    API requests are rate-limited per API key. Current limits:
    - 60 requests per minute
    - Burst capacity: 100 requests

  version: 1.0.0
  contact:
    name: Lumo Project
    url: https://github.com/ignacio/lumo
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080/api/v1
    description: Local development server
  - url: https://lumo-api.example.com/api/v1
    description: Production server

tags:
  - name: Health
    description: Health and readiness endpoints
  - name: Agents
    description: Agent registration and management
  - name: Diagnostics
    description: Diagnostic job submission
  - name: Jobs
    description: Job tracking and management

paths:
  /health:
    get:
      summary: Health check
      description: Returns the health status of the API server and its dependencies
      tags:
        - Health
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /ready:
    get:
      summary: Readiness check
      description: Kubernetes readiness probe endpoint
      tags:
        - Health
      responses:
        '200':
          description: Server is ready to accept requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready

  /live:
    get:
      summary: Liveness check
      description: Kubernetes liveness probe endpoint
      tags:
        - Health
      responses:
        '200':
          description: Server is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: alive

  /agents/register:
    post:
      summary: Register agent
      description: Register a new agent or update an existing agent registration
      tags:
        - Agents
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRegistrationRequest'
      responses:
        '201':
          description: Agent registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRegistrationResponse'
        '200':
          description: Existing agent updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRegistrationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /agents/{id}/heartbeat:
    put:
      summary: Record agent heartbeat
      description: Update agent heartbeat timestamp and set status to online
      tags:
        - Agents
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentId'
      responses:
        '200':
          description: Heartbeat recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Heartbeat recorded
                      status:
                        type: string
                        example: online
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /agents:
    get:
      summary: List agents
      description: List all registered agents with optional filtering
      tags:
        - Agents
      security:
        - ApiKeyAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by agent status
          schema:
            type: string
            enum: [online, offline, error]
        - name: platform
          in: query
          description: Filter by platform
          schema:
            type: string
            enum: [linux, darwin, windows, kubernetes]
        - name: sort
          in: query
          description: Sort field
          schema:
            type: string
            enum: [registered_at, last_heartbeat_at, name, hostname]
            default: registered_at
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: List of agents
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      agents:
                        type: array
                        items:
                          $ref: '#/components/schemas/Agent'
                      count:
                        type: integer
                        example: 10
        '401':
          $ref: '#/components/responses/Unauthorized'

  /agents/stats:
    get:
      summary: Get agent statistics
      description: Get aggregate statistics about registered agents
      tags:
        - Agents
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Agent statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      total:
                        type: integer
                        example: 100
                      online:
                        type: integer
                        example: 85
                      offline:
                        type: integer
                        example: 10
                      error:
                        type: integer
                        example: 5
                      by_status:
                        type: object
                        additionalProperties:
                          type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /agents/{id}:
    get:
      summary: Get agent details
      description: Get detailed information about a specific agent
      tags:
        - Agents
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentId'
      responses:
        '200':
          description: Agent details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Agent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Deregister agent
      description: Remove an agent from the registry
      tags:
        - Agents
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentId'
      responses:
        '200':
          description: Agent deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Agent deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /diagnostics:
    post:
      summary: Run diagnostics
      description: Submit a diagnostic job for execution
      tags:
        - Diagnostics
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagnosticRequest'
      responses:
        '201':
          description: Diagnostic job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /jobs:
    get:
      summary: List jobs
      description: List diagnostic and remediation jobs with optional filtering
      tags:
        - Jobs
      security:
        - ApiKeyAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by job status
          schema:
            type: string
            enum: [pending, running, completed, failed, cancelled]
        - name: type
          in: query
          description: Filter by job type
          schema:
            type: string
            enum: [diagnostic, remediation]
        - name: target
          in: query
          description: Filter by target hostname
          schema:
            type: string
        - name: sort
          in: query
          description: Sort field
          schema:
            type: string
            enum: [created_at, started_at, completed_at]
            default: created_at
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: List of jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      jobs:
                        type: array
                        items:
                          $ref: '#/components/schemas/Job'
                      count:
                        type: integer
                        example: 50
        '401':
          $ref: '#/components/responses/Unauthorized'

  /jobs/{id}:
    get:
      summary: Get job details
      description: Get detailed information about a specific job
      tags:
        - Jobs
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Delete job
      description: Delete a job record
      tags:
        - Jobs
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Job deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for authentication

  parameters:
    AgentId:
      name: id
      in: path
      required: true
      description: Agent UUID
      schema:
        type: string
        format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000

    JobId:
      name: id
      in: path
      required: true
      description: Job UUID
      schema:
        type: string
        format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000

    Limit:
      name: limit
      in: query
      description: Maximum number of results to return
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    Offset:
      name: offset
      in: query
      description: Number of results to skip
      schema:
        type: integer
        minimum: 0
        default: 0

  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time
        version:
          type: string
          example: 1.0.0
        services:
          type: object
          properties:
            database:
              type: string
              example: healthy
            cache:
              type: string
              example: healthy

    AgentRegistrationRequest:
      type: object
      required:
        - name
        - hostname
        - platform
        - architecture
        - version
      properties:
        name:
          type: string
          description: Friendly name for the agent
          example: agent-01
        hostname:
          type: string
          description: Agent hostname (unique identifier)
          example: node-01.example.com
        ip_address:
          type: string
          description: Agent IP address
          example: 192.168.1.100
        platform:
          type: string
          enum: [linux, darwin, windows, kubernetes]
          example: linux
        architecture:
          type: string
          description: CPU architecture
          example: amd64
        version:
          type: string
          description: Agent version
          example: 1.0.0
        capabilities:
          type: array
          description: Available diagnostic checkers
          items:
            type: string
          example: [cpu, memory, disk, process, service, network]
        labels:
          type: object
          description: User-defined labels
          additionalProperties:
            type: string
          example:
            environment: production
            region: us-west-2
            team: platform
        kubernetes_metadata:
          $ref: '#/components/schemas/KubernetesMetadata'

    AgentRegistrationResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            agent_id:
              type: string
              format: uuid
              example: 123e4567-e89b-12d3-a456-426614174000
            name:
              type: string
              example: agent-01
            hostname:
              type: string
              example: node-01.example.com
            status:
              type: string
              enum: [online, offline, error]
              example: online
            registered_at:
              type: string
              format: date-time

    Agent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        hostname:
          type: string
        ip_address:
          type: string
        platform:
          type: string
          enum: [linux, darwin, windows, kubernetes]
        architecture:
          type: string
        version:
          type: string
        status:
          type: string
          enum: [online, offline, error]
        capabilities:
          type: array
          items:
            type: string
        labels:
          type: object
          additionalProperties:
            type: string
        kubernetes_metadata:
          $ref: '#/components/schemas/KubernetesMetadata'
        last_heartbeat_at:
          type: string
          format: date-time
        registered_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    KubernetesMetadata:
      type: object
      properties:
        cluster:
          type: string
          example: prod-us-west-2
        namespace:
          type: string
          example: default
        node_name:
          type: string
          example: node-01
        pod_name:
          type: string
          example: lumo-agent-xyz123

    DiagnosticRequest:
      type: object
      required:
        - target
      properties:
        target:
          type: string
          description: Target hostname or IP
          example: localhost
        checks:
          type: array
          description: Specific checks to run (empty = all)
          items:
            type: string
          example: [cpu, memory, disk]
        format:
          type: string
          enum: [text, json, toon]
          default: json
          description: Output format
        analyze:
          type: boolean
          default: false
          description: Enable AI analysis
        dry_run:
          type: boolean
          default: false
          description: Dry run mode
        username:
          type: string
          description: SSH username (for remote targets)
        password:
          type: string
          description: SSH password (for remote targets)
        key_path:
          type: string
          description: SSH key path (for remote targets)

    DiagnosticResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            job_id:
              type: string
              format: uuid
            status:
              type: string
              enum: [pending, running, completed, failed]
              example: pending
            target:
              type: string
            created_at:
              type: string
              format: date-time

    Job:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [diagnostic, remediation]
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled]
        target:
          type: string
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        created_by:
          type: string
        result:
          type: object
          description: Job result (format varies by type)
        error:
          type: string
        metadata:
          type: object
          additionalProperties: true

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: invalid_request
            message:
              type: string
              example: Invalid request parameters

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Unauthorized - API key missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
