version: 2.1

# Pipeline parameters for conditional execution
parameters:
  run-ci:
    type: boolean
    default: true

# Define reusable executors
executors:
  go-executor:
    docker:
      - image: cimg/go:1.25.4
    working_directory: ~/lumo
    environment:
      GO111MODULE: "on"

# Define reusable commands
commands:
  setup-dependencies:
    description: "Download and verify Go dependencies"
    steps:
      - run:
          name: Download dependencies
          command: go mod download
      - run:
          name: Verify dependencies
          command: go mod verify

  install-tools:
    description: "Install required CI tools"
    steps:
      - run:
          name: Install golangci-lint
          command: |
            curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin latest
      - run:
          name: Install govulncheck
          command: go install golang.org/x/vuln/cmd/govulncheck@latest

# Define jobs
jobs:
  lint-and-security:
    executor: go-executor
    steps:
      - checkout
      - setup-dependencies
      - install-tools
      - run:
          name: Run golangci-lint
          command: golangci-lint run --timeout=5m
      - run:
          name: Run vulnerability check
          command: govulncheck ./...

  test:
    executor: go-executor
    steps:
      - checkout
      - setup-dependencies
      - run:
          name: Run tests with race detector
          command: make ci-test
      - store_test_results:
          path: /tmp/test-results
      - store_artifacts:
          path: /tmp/test-results

  build:
    executor: go-executor
    steps:
      - checkout
      - setup-dependencies
      - run:
          name: Build CLI and Agent binaries
          command: make ci-build
      - persist_to_workspace:
          root: .
          paths:
            - lumo
            - lumo-agent

  # Cross-platform builds (only on main/master)
  build-cross-platform:
    executor: go-executor
    parameters:
      goos:
        type: string
      goarch:
        type: string
    steps:
      - checkout
      - setup-dependencies
      - run:
          name: Build for << parameters.goos >>/<< parameters.goarch >>
          environment:
            GOOS: << parameters.goos >>
            GOARCH: << parameters.goarch >>
          command: |
            echo "Building for ${GOOS}/${GOARCH}..."
            go build -v -o lumo-${GOOS}-${GOARCH} ./cmd/lumo
            go build -v -o lumo-agent-${GOOS}-${GOARCH} ./cmd/lumo-agent
            ls -lh lumo-* lumo-agent-*
      - store_artifacts:
          path: lumo-<< parameters.goos >>-<< parameters.goarch >>
      - store_artifacts:
          path: lumo-agent-<< parameters.goos >>-<< parameters.goarch >>

  # Integration test (optional - runs full CI suite)
  integration:
    executor: go-executor
    steps:
      - checkout
      - setup-dependencies
      - install-tools
      - run:
          name: Run full CI suite
          command: make ci

# Define workflows
workflows:
  version: 2

  # Main CI workflow - runs only when code/config files change
  ci:
    when: << pipeline.parameters.run-ci >>
    jobs:
      - lint-and-security
      - test
      - build:
          requires:
            - lint-and-security
            - test

  # Cross-platform builds - only on main/master branches with code changes
  build-all-platforms:
    when: << pipeline.parameters.run-ci >>
    jobs:
      - build-cross-platform:
          name: build-linux-amd64
          goos: linux
          goarch: amd64
          filters:
            branches:
              only:
                - main
                - master
      - build-cross-platform:
          name: build-linux-arm64
          goos: linux
          goarch: arm64
          filters:
            branches:
              only:
                - main
                - master
      - build-cross-platform:
          name: build-darwin-amd64
          goos: darwin
          goarch: amd64
          filters:
            branches:
              only:
                - main
                - master
      - build-cross-platform:
          name: build-darwin-arm64
          goos: darwin
          goarch: arm64
          filters:
            branches:
              only:
                - main
                - master

  # Nightly integration test
  nightly:
    triggers:
      - schedule:
          cron: "0 0 * * *"
          filters:
            branches:
              only:
                - main
                - master
    jobs:
      - integration
