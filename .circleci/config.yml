version: 2.1

# Enable dynamic configuration
setup: true

# Use continuation orb for conditional CI execution
orbs:
  continuation: circleci/continuation@1.0.0

# Define reusable executors
executors:
  go-executor:
    docker:
      - image: cimg/go:1.25.4
    working_directory: ~/lumo
    environment:
      GO111MODULE: "on"

# Define jobs
jobs:
  # Check changed files to determine if CI should run
  check-files:
    executor: go-executor
    steps:
      - checkout
      - run:
          name: Check if code files changed
          command: |
            set -e

            # Get list of changed files
            if [ "$CIRCLE_BRANCH" = "main" ] || [ "$CIRCLE_BRANCH" = "master" ]; then
              # On main/master, check if this is a merge commit from a PR
              COMMIT_MSG=$(git log -1 --format=%s)
              if echo "$COMMIT_MSG" | grep -qE '^Merge pull request|^Merge branch'; then
                echo "Merge commit detected: $COMMIT_MSG"
                echo "This PR already passed CI - skipping redundant tests"
                RUN_CI=false
                echo "{\"run-ci\": false}" > /tmp/pipeline-parameters.json
                cat /tmp/pipeline-parameters.json
                circleci-agent step halt
              fi
              # On main/master, check last commit
              CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r HEAD)
            else
              # On feature branches, compare to main/master
              echo "Fetching origin/main..."
              git fetch origin main 2>&1 || echo "main branch not found, trying master..."

              if git rev-parse --verify origin/main >/dev/null 2>&1; then
                BASE_BRANCH="origin/main"
              elif git rev-parse --verify origin/master >/dev/null 2>&1; then
                BASE_BRANCH="origin/master"
              else
                echo "ERROR: Could not find main or master branch"
                exit 1
              fi

              echo "Comparing against $BASE_BRANCH..."
              CHANGED_FILES=$(git diff --name-only $BASE_BRANCH...HEAD)
            fi

            echo "Changed files:"
            echo "$CHANGED_FILES"

            # Check if any code/config files changed
            if echo "$CHANGED_FILES" | grep -qE '\.(go|mod|sum)$|^Makefile$|^\.circleci/|^deployments/.*\.yaml$|^configs/.*\.yaml$'; then
              echo "Code or config files changed - CI will run"
              RUN_CI=true
            else
              echo "Only documentation files changed - CI will be skipped"
              RUN_CI=false
            fi

            # Continue to main config with parameter
            echo "{\"run-ci\": $RUN_CI}" > /tmp/pipeline-parameters.json
            cat /tmp/pipeline-parameters.json
      - continuation/continue:
          configuration_path: .circleci/continue-config.yml
          parameters: /tmp/pipeline-parameters.json

# Define workflows
workflows:
  setup:
    jobs:
      - check-files
