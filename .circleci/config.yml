version: 2.1

# Define reusable executors
executors:
  go-executor:
    docker:
      - image: cimg/go:1.25.4
    working_directory: ~/lumo
    environment:
      GO111MODULE: "on"
    resource_class: small  # Use smaller resource class to save credits

# Define reusable commands
commands:
  restore-dependencies:
    description: "Restore cached Go dependencies"
    steps:
      - restore_cache:
          keys:
            - go-mod-v1-{{ checksum "go.sum" }}
            - go-mod-v1-

  save-dependencies:
    description: "Cache Go dependencies"
    steps:
      - save_cache:
          key: go-mod-v1-{{ checksum "go.sum" }}
          paths:
            - ~/go/pkg/mod

  setup-dependencies:
    description: "Download and verify Go dependencies"
    steps:
      - restore-dependencies
      - run:
          name: Download dependencies
          command: go mod download
      - run:
          name: Verify dependencies
          command: go mod verify
      - save-dependencies

  install-tools:
    description: "Install required CI tools"
    steps:
      - restore_cache:
          keys:
            - tools-v1-{{ arch }}
      - run:
          name: Install golangci-lint
          command: |
            if [ ! -f ~/go/bin/golangci-lint ]; then
              curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin latest
            fi
      - run:
          name: Install govulncheck
          command: |
            if [ ! -f ~/go/bin/govulncheck ]; then
              go install golang.org/x/vuln/cmd/govulncheck@latest
            fi
      - save_cache:
          key: tools-v1-{{ arch }}
          paths:
            - ~/go/bin

# Define jobs
jobs:
  lint-and-security:
    executor: go-executor
    steps:
      - checkout
      - setup-dependencies
      - install-tools
      - run:
          name: Run golangci-lint
          command: golangci-lint run --timeout=5m
      - run:
          name: Run vulnerability check
          command: govulncheck ./...

  test:
    executor: go-executor
    steps:
      - checkout
      - setup-dependencies
      - run:
          name: Run tests with race detector
          command: make ci-test
      - store_test_results:
          path: /tmp/test-results
      - store_artifacts:
          path: /tmp/test-results

  build:
    executor: go-executor
    steps:
      - checkout
      - setup-dependencies
      - run:
          name: Build CLI and Agent binaries
          command: make ci-build
      - persist_to_workspace:
          root: .
          paths:
            - lumo
            - lumo-agent

  # Cross-platform builds (only on main/master)
  build-cross-platform:
    executor: go-executor
    parameters:
      goos:
        type: string
      goarch:
        type: string
    steps:
      - checkout
      - setup-dependencies
      - run:
          name: Build for << parameters.goos >>/<< parameters.goarch >>
          environment:
            GOOS: << parameters.goos >>
            GOARCH: << parameters.goarch >>
          command: |
            echo "Building for ${GOOS}/${GOARCH}..."
            go build -v -o lumo-${GOOS}-${GOARCH} ./cmd/lumo
            go build -v -o lumo-agent-${GOOS}-${GOARCH} ./cmd/lumo-agent
            ls -lh lumo-* lumo-agent-*
      - store_artifacts:
          path: lumo-<< parameters.goos >>-<< parameters.goarch >>
      - store_artifacts:
          path: lumo-agent-<< parameters.goos >>-<< parameters.goarch >>

  # Integration test (optional - runs full CI suite)
  integration:
    executor: go-executor
    steps:
      - checkout
      - setup-dependencies
      - install-tools
      - run:
          name: Run full CI suite
          command: make ci

# Define workflows
workflows:
  version: 2

  # Main CI workflow - runs on main branch and PRs
  # NOTE: Enable "Only build pull requests" in CircleCI Project Settings
  # This ensures PRs are tested while skipping random feature branch pushes
  ci:
    jobs:
      - lint-and-security
      - test
      - build:
          requires:
            - lint-and-security
            - test
      # Cross-platform builds merged into main workflow
      # Only runs after main build succeeds
      - build-cross-platform:
          name: build-linux-amd64
          goos: linux
          goarch: amd64
          requires:
            - build
          filters:
            branches:
              only:
                - main
                - master
      - build-cross-platform:
          name: build-linux-arm64
          goos: linux
          goarch: arm64
          requires:
            - build
          filters:
            branches:
              only:
                - main
                - master
      - build-cross-platform:
          name: build-darwin-amd64
          goos: darwin
          goarch: amd64
          requires:
            - build
          filters:
            branches:
              only:
                - main
                - master
      - build-cross-platform:
          name: build-darwin-arm64
          goos: darwin
          goarch: arm64
          requires:
            - build
          filters:
            branches:
              only:
                - main
                - master

  # Weekly integration test (reduced from daily to save credits)
  weekly:
    triggers:
      - schedule:
          cron: "0 0 * * 0"  # Sunday at midnight UTC
          filters:
            branches:
              only:
                - main
                - master
    jobs:
      - integration
