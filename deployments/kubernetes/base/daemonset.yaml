---
# DaemonSet for Per-Node Monitoring
# Runs one Lumo agent pod on every node in the cluster
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: lumo-agent-node
  namespace: lumo-system
  labels:
    app.kubernetes.io/name: lumo-agent
    app.kubernetes.io/component: node-monitor
    app.kubernetes.io/part-of: lumo
    app.kubernetes.io/version: "1.0.0"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: lumo-agent
      app.kubernetes.io/component: node-monitor

  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1

  template:
    metadata:
      labels:
        app.kubernetes.io/name: lumo-agent
        app.kubernetes.io/component: node-monitor
        app.kubernetes.io/part-of: lumo
        app.kubernetes.io/version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"

    spec:
      serviceAccountName: lumo-agent
      hostNetwork: true  # Required for node-level network diagnostics
      hostPID: true      # Required for process monitoring
      dnsPolicy: ClusterFirstWithHostNet

      # Node selector (optional - can target specific nodes)
      # nodeSelector:
      #   lumo.io/monitor: "true"

      # Tolerations to run on all nodes including control plane
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists

      # Priority class for system-critical workloads
      priorityClassName: system-node-critical

      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534  # nobody user
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: lumo-agent
          image: ghcr.io/ignacio/lumo-agent:latest
          imagePullPolicy: IfNotPresent

          # Security context for container
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
              add:
                - NET_RAW      # For network diagnostics
                - SYS_PTRACE   # For process monitoring (optional)

          # Environment variables
          env:
            # Agent configuration from ConfigMap
            - name: LUMO_AGENT_MODE
              valueFrom:
                configMapKeyRef:
                  name: lumo-agent-config
                  key: agent.mode

            - name: LUMO_AGENT_SCHEDULE
              valueFrom:
                configMapKeyRef:
                  name: lumo-agent-config
                  key: agent.schedule

            - name: LUMO_AGENT_API_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: lumo-agent-config
                  key: agent.api-endpoint

            - name: LUMO_AGENT_TLS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: lumo-agent-config
                  key: agent.tls-enabled

            - name: LUMO_AGENT_ENABLED_CHECKS
              valueFrom:
                configMapKeyRef:
                  name: lumo-agent-config
                  key: agent.enabled-checks

            - name: LUMO_AGENT_REPORT_FORMAT
              valueFrom:
                configMapKeyRef:
                  name: lumo-agent-config
                  key: agent.report-format

            - name: LUMO_AGENT_OFFLINE_MODE
              valueFrom:
                configMapKeyRef:
                  name: lumo-agent-config
                  key: agent.offline-mode

            - name: LUMO_AGENT_HEALTH_CHECK_PORT
              valueFrom:
                configMapKeyRef:
                  name: lumo-agent-config
                  key: agent.health-check-port

            - name: LUMO_AGENT_METRICS_PORT
              valueFrom:
                configMapKeyRef:
                  name: lumo-agent-config
                  key: agent.metrics-port

            - name: LUMO_AGENT_KUBERNETES_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: lumo-agent-config
                  key: agent.kubernetes.enabled

            - name: LUMO_AGENT_KUBERNETES_SCOPE
              value: "node"  # DaemonSet monitors nodes

            - name: LUMO_LOGGING_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: lumo-agent-config
                  key: logging.level

            - name: LUMO_LOGGING_FORMAT
              valueFrom:
                configMapKeyRef:
                  name: lumo-agent-config
                  key: logging.format

            # Secrets from Secret
            - name: LUMO_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lumo-agent-secret
                  key: agent-token

            - name: LUMO_ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lumo-agent-secret
                  key: anthropic-api-key
                  optional: true

            - name: LUMO_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lumo-agent-secret
                  key: openai-api-key
                  optional: true

            - name: LUMO_GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lumo-agent-secret
                  key: gemini-api-key
                  optional: true

            - name: LUMO_OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lumo-agent-secret
                  key: openrouter-api-key
                  optional: true

            # Node information
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

          # Resource limits
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          # Volume mounts
          volumeMounts:
            # Config file
            - name: config
              mountPath: /etc/lumo
              readOnly: true

            # Cache directory (writable)
            - name: cache
              mountPath: /var/cache/lumo

            # Host filesystem (read-only for diagnostics)
            - name: host-root
              mountPath: /host
              readOnly: true

            # Host proc (for process monitoring)
            - name: host-proc
              mountPath: /host/proc
              readOnly: true

            # Host sys (for system metrics)
            - name: host-sys
              mountPath: /host/sys
              readOnly: true

          # Liveness probe
          livenessProbe:
            httpGet:
              path: /live
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3

          # Readiness probe
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3

          # Startup probe (for slow-starting containers)
          startupProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 12

      # Volumes
      volumes:
        # ConfigMap with full config.yaml
        - name: config
          configMap:
            name: lumo-agent-config
            items:
              - key: config.yaml
                path: config.yaml

        # EmptyDir for cache
        - name: cache
          emptyDir:
            sizeLimit: 1Gi

        # Host filesystem mounts
        - name: host-root
          hostPath:
            path: /
            type: Directory

        - name: host-proc
          hostPath:
            path: /proc
            type: Directory

        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
