---
# ConfigMap for Lumo Agent Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: lumo-agent-config
  namespace: lumo-system
  labels:
    app.kubernetes.io/name: lumo-agent
    app.kubernetes.io/component: configuration
    app.kubernetes.io/part-of: lumo
data:
  # Agent operational mode
  # Options: scheduled, on-demand, continuous, hybrid
  agent.mode: "hybrid"

  # Cron schedule for periodic diagnostics (used in scheduled/hybrid mode)
  # Default: every 5 minutes
  agent.schedule: "*/5 * * * *"

  # API endpoint for reporting
  agent.api-endpoint: "http://lumo-api:8080"

  # TLS configuration
  agent.tls-enabled: "false"

  # Enabled diagnostic checks (comma-separated)
  agent.enabled-checks: "cpu,memory,disk,process,service,network,kubernetes"

  # Report format (text, json, toon)
  # TOON format reduces AI token costs by 30-60%
  agent.report-format: "toon"

  # Offline mode - continue operation if API unavailable
  agent.offline-mode: "true"

  # Health check port
  agent.health-check-port: "8080"

  # Prometheus metrics port
  agent.metrics-port: "9090"

  # Kubernetes-specific configuration
  agent.kubernetes.enabled: "true"
  agent.kubernetes.scope: "node"  # node|cluster

  # Logging configuration
  logging.level: "info"  # debug, info, warn, error
  logging.format: "json"  # text, json

  # Diagnostic configuration
  diagnostics.timeout: "30s"
  diagnostics.parallel: "true"
  diagnostics.max-workers: "4"

  # Cache configuration
  cache.enabled: "true"
  cache.ttl: "5m"
  cache.max-size: "100"

  # Retry configuration
  retry.max-attempts: "4"
  retry.initial-interval: "2s"
  retry.max-interval: "30s"
  retry.multiplier: "2.0"

  # Resource limits awareness
  resources.memory-limit-aware: "true"
  resources.cpu-limit-aware: "true"

  # config.yaml - Full agent configuration file
  config.yaml: |
    # Lumo Agent Configuration
    # This configuration is used when the agent is deployed in Kubernetes

    ssh:
      timeout: 30s
      retry_attempts: 3
      retry_delay: 5s
      known_hosts_file: ""
      strict_host_key_checking: false

    ai:
      # AI provider will be configured via environment variables
      # Use LUMO_AI_PROVIDER and provider-specific API keys
      provider: ""
      api_key: ""
      model: ""
      max_tokens: 4096
      temperature: 0.7
      stream: true

    logging:
      level: info
      format: json
      output: stdout

    diagnostics:
      timeout: 30s
      parallel: true
      max_workers: 4
      enabled_checks:
        - cpu
        - memory
        - disk
        - process
        - service
        - network
        - kubernetes

    agent:
      mode: hybrid
      schedule: "*/5 * * * *"
      api_endpoint: http://lumo-api:8080
      token: ""  # Set via environment variable
      tls_enabled: false
      enabled_checks:
        - cpu
        - memory
        - disk
        - process
        - service
        - network
        - kubernetes
      report_format: toon
      offline_mode: true
      health_check_port: 8080
      metrics_port: 9090

      kubernetes:
        enabled: true
        scope: node  # node or cluster

      cache:
        enabled: true
        ttl: 5m
        max_size: 100

      retry:
        max_attempts: 4
        initial_interval: 2s
        max_interval: 30s
        multiplier: 2.0
