---
# Secret for Lumo Agent Sensitive Data
# IMPORTANT: This is a template file. Do NOT commit actual secrets to version control.
# Create actual secrets using kubectl or external secret managers (Vault, AWS Secrets Manager, etc.)
apiVersion: v1
kind: Secret
metadata:
  name: lumo-agent-secret
  namespace: lumo-system
  labels:
    app.kubernetes.io/name: lumo-agent
    app.kubernetes.io/component: configuration
    app.kubernetes.io/part-of: lumo
type: Opaque
stringData:
  # Agent API authentication token (JWT)
  # Generate with: kubectl create secret generic lumo-agent-secret --from-literal=agent-token="your-jwt-token"
  agent-token: "REPLACE_WITH_ACTUAL_JWT_TOKEN"

  # AI provider API keys (configure based on your AI provider)
  # Only set the key for the provider you're using

  # Anthropic (Claude)
  anthropic-api-key: ""

  # OpenAI (GPT)
  openai-api-key: ""

  # Google Gemini
  gemini-api-key: ""

  # OpenRouter
  openrouter-api-key: ""

  # Ollama (usually not needed for API key)
  ollama-api-key: ""

  # TLS certificates (if using mTLS)
  # These will be mounted as files in the container
  tls-ca-cert: ""
  tls-client-cert: ""
  tls-client-key: ""

---
# Example: Creating secrets using kubectl
#
# 1. Create namespace
# kubectl create namespace lumo-system
#
# 2. Create secret from literal values
# kubectl create secret generic lumo-agent-secret \
#   --namespace=lumo-system \
#   --from-literal=agent-token="your-jwt-token-here" \
#   --from-literal=anthropic-api-key="sk-ant-..." \
#   --dry-run=client -o yaml | kubectl apply -f -
#
# 3. Create secret from files (for TLS certificates)
# kubectl create secret generic lumo-agent-tls \
#   --namespace=lumo-system \
#   --from-file=tls-ca-cert=/path/to/ca.crt \
#   --from-file=tls-client-cert=/path/to/client.crt \
#   --from-file=tls-client-key=/path/to/client.key
#
# 4. Using external secret managers (recommended for production)
#
# Example with External Secrets Operator:
# apiVersion: external-secrets.io/v1beta1
# kind: ExternalSecret
# metadata:
#   name: lumo-agent-secret
#   namespace: lumo-system
# spec:
#   refreshInterval: 1h
#   secretStoreRef:
#     name: vault-backend
#     kind: SecretStore
#   target:
#     name: lumo-agent-secret
#     creationPolicy: Owner
#   data:
#     - secretKey: agent-token
#       remoteRef:
#         key: lumo/agent-token
#     - secretKey: anthropic-api-key
#       remoteRef:
#         key: lumo/ai/anthropic-api-key
#
# Example with AWS Secrets Manager:
# apiVersion: external-secrets.io/v1beta1
# kind: ExternalSecret
# metadata:
#   name: lumo-agent-secret
#   namespace: lumo-system
# spec:
#   refreshInterval: 1h
#   secretStoreRef:
#     name: aws-secrets-manager
#     kind: SecretStore
#   target:
#     name: lumo-agent-secret
#   dataFrom:
#     - extract:
#         key: lumo-agent-secrets
