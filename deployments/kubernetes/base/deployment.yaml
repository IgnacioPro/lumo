---
# Deployment for Cluster-Wide Monitoring
# Runs Lumo agent for cluster-level diagnostics via K8s API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumo-agent-cluster
  namespace: lumo-system
  labels:
    app.kubernetes.io/name: lumo-agent
    app.kubernetes.io/component: cluster-monitor
    app.kubernetes.io/part-of: lumo
    app.kubernetes.io/version: "1.0.0"
spec:
  # High availability - run 2+ replicas
  replicas: 2

  selector:
    matchLabels:
      app.kubernetes.io/name: lumo-agent
      app.kubernetes.io/component: cluster-monitor

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app.kubernetes.io/name: lumo-agent
        app.kubernetes.io/component: cluster-monitor
        app.kubernetes.io/part-of: lumo
        app.kubernetes.io/version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"

    spec:
      serviceAccountName: lumo-agent

      # Pod anti-affinity for HA (spread across nodes)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - cluster-monitor
                topologyKey: kubernetes.io/hostname

      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534  # nobody user
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: lumo-agent
          image: lumo-agent:latest
          imagePullPolicy: Never

          # Security context for container
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL

          # Environment variables
          env:
            # Agent configuration from ConfigMap
            - name: LUMO_AGENT_MODE
              valueFrom:
                configMapKeyRef:
                  name: lumo-agent-config
                  key: agent.mode

            - name: LUMO_AGENT_SCHEDULE
              valueFrom:
                configMapKeyRef:
                  name: lumo-agent-config
                  key: agent.schedule

            - name: LUMO_AGENT_API_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: lumo-agent-config
                  key: agent.api-endpoint

            - name: LUMO_AGENT_TLS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: lumo-agent-config
                  key: agent.tls-enabled

            - name: LUMO_AGENT_ENABLED_CHECKS
              valueFrom:
                configMapKeyRef:
                  name: lumo-agent-config
                  key: agent.enabled-checks

            - name: LUMO_AGENT_REPORT_FORMAT
              valueFrom:
                configMapKeyRef:
                  name: lumo-agent-config
                  key: agent.report-format

            - name: LUMO_AGENT_OFFLINE_MODE
              valueFrom:
                configMapKeyRef:
                  name: lumo-agent-config
                  key: agent.offline-mode

            - name: LUMO_AGENT_HEALTH_CHECK_PORT
              valueFrom:
                configMapKeyRef:
                  name: lumo-agent-config
                  key: agent.health-check-port

            - name: LUMO_AGENT_METRICS_PORT
              valueFrom:
                configMapKeyRef:
                  name: lumo-agent-config
                  key: agent.metrics-port

            - name: LUMO_AGENT_KUBERNETES_ENABLED
              value: "true"

            - name: LUMO_AGENT_KUBERNETES_SCOPE
              value: "cluster"  # Deployment monitors entire cluster

            - name: LUMO_AGENT_CACHE_PATH
              value: "/var/cache/lumo"

            - name: LUMO_AI_ENABLED
              value: "false"

            - name: LUMO_LOGGING_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: lumo-agent-config
                  key: logging.level

            - name: LUMO_LOGGING_FORMAT
              valueFrom:
                configMapKeyRef:
                  name: lumo-agent-config
                  key: logging.format

            # Secrets from Secret
            - name: LUMO_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lumo-agent-secret
                  key: agent-token

            - name: LUMO_ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lumo-agent-secret
                  key: anthropic-api-key
                  optional: true

            - name: LUMO_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lumo-agent-secret
                  key: openai-api-key
                  optional: true

            - name: LUMO_GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lumo-agent-secret
                  key: gemini-api-key
                  optional: true

            - name: LUMO_OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lumo-agent-secret
                  key: openrouter-api-key
                  optional: true

            # Kubernetes metadata (mapped to LUMO_ prefix for viper)
            - name: LUMO_AGENT_KUBERNETES_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            - name: LUMO_AGENT_KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

            - name: LUMO_AGENT_KUBERNETES_CLUSTER
              value: "kind-lumo-test"

            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

          # Resource limits (lower than DaemonSet since no host access needed)
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

          # Volume mounts
          volumeMounts:
            # Config file
            - name: config
              mountPath: /etc/lumo
              readOnly: true

            # Cache directory (writable)
            - name: cache
              mountPath: /var/cache/lumo

          # Liveness probe
          livenessProbe:
            httpGet:
              path: /live
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3

          # Readiness probe
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3

          # Startup probe
          startupProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 12

      # Volumes
      volumes:
        # ConfigMap with full config.yaml
        - name: config
          configMap:
            name: lumo-agent-config
            items:
              - key: config.yaml
                path: config.yaml

        # EmptyDir for cache
        - name: cache
          emptyDir:
            sizeLimit: 500Mi
