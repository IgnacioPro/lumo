---
# Lumo API Server Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: lumo-api-config
  namespace: lumo-system
  labels:
    app.kubernetes.io/name: lumo-api
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: lumo
data:
  # Database configuration
  database.host: "postgres.lumo-system.svc.cluster.local"
  database.port: "5432"
  database.name: "lumo"
  database.sslmode: "require"  # Use 'require' in production

  # AI configuration
  ai.enabled: "true"
  ai.provider: "anthropic"  # anthropic, openai, gemini, ollama, openrouter

  # API configuration
  config.yaml: |
    environment: production

    api:
      host: 0.0.0.0
      port: 8080
      read_timeout: 30s
      write_timeout: 60s
      
      # Rate limiting
      rate_limit_enabled: true
      rate_limit_requests_per_min: 60
      rate_limit_requests_per_hour: 3600
      rate_limit_burst_size: 10
      
      # CORS (configure for your domain)
      allowed_origins:
        - "https://lumo.example.com"

    database:
      max_open_conns: 25
      max_idle_conns: 5
      conn_max_lifetime: 5m
      conn_max_idle_time: 1m

    ai:
      enabled: true
      provider: anthropic
      model: claude-sonnet-4-20250514
      timeout: 60s
      max_retries: 3
      temperature: 0.7
      max_tokens: 4096

    notifications:
      enabled: true
      notifiers:
        - name: slack-alerts
          type: slack
          enabled: true
          webhook_url: ${SLACK_WEBHOOK_URL}
          timeout: 30s

    logging:
      level: info
      format: json
