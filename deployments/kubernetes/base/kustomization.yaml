apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lumo-system

resources:
  - rbac.yaml
  - configmap.yaml
  - secret.yaml
  - daemonset.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml

commonLabels:
  app.kubernetes.io/name: lumo-agent
  app.kubernetes.io/part-of: lumo

# ConfigMap generator for custom config
# configMapGenerator:
#   - name: lumo-agent-config
#     files:
#       - config.yaml

# Secret generator (for development only)
# secretGenerator:
#   - name: lumo-agent-secret
#     literals:
#       - agent-token=YOUR_TOKEN_HERE

images:
  - name: ghcr.io/ignacio/lumo-agent
    newTag: latest
