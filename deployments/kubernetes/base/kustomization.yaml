apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lumo-system

# SECURITY NOTE: secret.yaml has been renamed to secret.yaml.template
# to prevent accidental deployment of placeholder secrets.
# Create actual secrets using kubectl:
#   kubectl create secret generic lumo-agent-secret \
#     --namespace=lumo-system \
#     --from-literal=agent-token="your-jwt-token-here" \
#     --from-literal=anthropic-api-key="sk-ant-..."
# Or use an external secret manager (Vault, AWS Secrets Manager, etc.)
# See secret.yaml.template for complete examples.

resources:
  - rbac.yaml
  - configmap-agent.yaml
  - configmap-api.yaml
  - deployment-agent.yaml
  - deployment-api.yaml
  - service.yaml
  - networkpolicy.yaml

commonLabels:
  app.kubernetes.io/part-of: lumo

# ConfigMap generator for custom config
# configMapGenerator:
#   - name: lumo-agent-config
#     files:
#       - config.yaml

# Secret generator (for development only)
# secretGenerator:
#   - name: lumo-agent-secret
#     literals:
#       - agent-token=YOUR_TOKEN_HERE

images:
  - name: ghcr.io/ignacio/lumo-agent
    newTag: latest
  - name: ghcr.io/ignacio/lumo
    newTag: latest
