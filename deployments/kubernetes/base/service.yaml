---
# Service for Lumo Agent Event-Driven Deployment
# Exposes health and metrics endpoints for event-driven agents
apiVersion: v1
kind: Service
metadata:
  name: lumo-agent
  namespace: lumo-system
  labels:
    app: lumo-agent
    app.kubernetes.io/name: lumo-agent
    app.kubernetes.io/component: event-driven
    app.kubernetes.io/part-of: lumo
    mode: event-driven
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: lumo-agent
    mode: event-driven
  ports:
    - name: health
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

---
# ServiceMonitor for Prometheus Operator (optional)
# Automatically configures Prometheus to scrape Lumo agent metrics
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: lumo-agent
  namespace: lumo-system
  labels:
    app.kubernetes.io/name: lumo-agent
    app.kubernetes.io/part-of: lumo
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: lumo-agent
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
      scheme: http
