apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: lumo-system
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: lumo
        - name: POSTGRES_USER
          value: lumo
        - name: POSTGRES_PASSWORD
          value: lumo
        ports:
        - containerPort: 5432
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: lumo-system
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
