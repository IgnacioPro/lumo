apiVersion: v1
kind: Secret
metadata:
  name: lumo-secrets
  namespace: lumo-system
type: Opaque
stringData:
  # Slack webhook URL (Legacy)
  slack-webhook-url: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
  
  # Slack Bot Token (Recommended for dynamic updates)
  # Scope required: chat:write
  slack-bot-token: "xoxb-YOUR-BOT-TOKEN"
  
  # Slack Channel ID
  slack-channel-id: "C12345678"