---
# Redis Deployment for Lumo Event-Driven Agent State Tracking
# Used for ephemeral debounce/dedup state - events are persisted in PostgreSQL
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumo-redis
  namespace: lumo-system
  labels:
    app: lumo-redis
    component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lumo-redis
  template:
    metadata:
      labels:
        app: lumo-redis
        component: cache
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
        # Redis Exporter - Exposes Prometheus metrics
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.55.0-alpine
          ports:
            - containerPort: 9121
              name: metrics
          env:
            - name: REDIS_ADDR
              value: "localhost:6379"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 9121
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 9121
            initialDelaySeconds: 5
            periodSeconds: 5

---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: lumo-redis
  namespace: lumo-system
  labels:
    app: lumo-redis
    component: cache
spec:
  type: ClusterIP
  selector:
    app: lumo-redis
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
    - port: 9121
      targetPort: 9121
      protocol: TCP
      name: metrics
