---
# Redis Deployment for Lumo Event-Driven Agent State Tracking
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumo-redis
  namespace: lumo-system
  labels:
    app: lumo-redis
    component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lumo-redis
  template:
    metadata:
      labels:
        app: lumo-redis
        component: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5

---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: lumo-redis
  namespace: lumo-system
  labels:
    app: lumo-redis
    component: cache
spec:
  type: ClusterIP
  selector:
    app: lumo-redis
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
