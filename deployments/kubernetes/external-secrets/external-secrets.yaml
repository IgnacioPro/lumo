# External Secrets for Lumo
# These resources sync secrets from GCP Secret Manager to Kubernetes Secrets
#
# Prerequisites:
# 1. ClusterSecretStore 'gcp-secret-manager' configured
# 2. Secrets created in GCP Secret Manager (see scripts/create-gcp-secrets.sh)
#
# Usage:
#   kubectl apply -f external-secrets.yaml
---
# API Server Secrets (JWT, Database)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: lumo-api-secrets
  namespace: lumo-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: lumo-api-secret
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: lumo
          app.kubernetes.io/component: api
  data:
    - secretKey: jwt-secret
      remoteRef:
        key: lumo-jwt-secret
    - secretKey: database-password
      remoteRef:
        key: lumo-database-password
---
# AI Provider Secrets (Anthropic, OpenAI)
apiVersion: external-secrets.io/v1beta1
