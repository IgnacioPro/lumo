# ClusterSecretStore for GCP Secret Manager
# This resource configures how External Secrets Operator authenticates with GCP
#
# Prerequisites:
# 1. External Secrets Operator installed
# 2. GCP Service Account with secretmanager.secretAccessor role
# 3. Either Workload Identity (GKE) or service account key configured
#
# Usage:
#   kubectl apply -f cluster-secret-store.yaml
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      # Replace with your GCP project ID
      projectID: ${GCP_PROJECT_ID}
      
      # Option A: Workload Identity (Recommended for GKE)
      # Uncomment this section and comment out Option B
      # auth:
      #   workloadIdentity:
      #     clusterLocation: us-central1  # Your GKE cluster region
      #     clusterName: lumo-cluster     # Your GKE cluster name
      #     serviceAccountRef:
      #       name: external-secrets
      #       namespace: external-secrets
      
      # Option B: Service Account Key (For non-GKE clusters)
      # Create the secret first:
      #   kubectl create secret generic gcp-secret-manager-credentials \
      #     --from-file=secret-access-credentials=gcp-sa-key.json \
      #     -n external-secrets
      auth:
        secretRef:
          secretAccessKeySecretRef:
            name: gcp-secret-manager-credentials
            key: secret-access-credentials
            namespace: external-secrets
---
# Alternative: Namespace-scoped SecretStore (more restrictive)
# Use this if you want per-namespace secret stores
