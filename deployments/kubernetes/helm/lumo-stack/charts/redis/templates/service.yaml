{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: lumo-redis
  namespace: {{ .Values.global.namespace }}
  labels:
    app: lumo-redis
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: lumo
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: ClusterIP
  ports:
  - name: redis
    port: 6379
    targetPort: redis
    protocol: TCP
  selector:
    app: lumo-redis
{{- end }}
