{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: lumo-api-config
  namespace: {{ .Values.global.namespace }}
  labels:
    app: lumo-api
    app.kubernetes.io/name: lumo-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: lumo
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  config.yaml: |
    api:
      host: 0.0.0.0
      port: 8080
      allowed_origins:
        - "*"

    database:
      max_open_connections: 25
      max_idle_connections: 5
      connection_max_lifetime: 5m

    logging:
      level: info
      format: json

    rate_limiting:
      enabled: true
      per_ip_requests_per_minute: 60
      per_user_requests_per_hour: 3600
{{- end }}
