{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumo-api
  namespace: {{ .Values.global.namespace }}
  labels:
    app: lumo-api
    app.kubernetes.io/name: lumo-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: lumo
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: lumo-api
  template:
    metadata:
      labels:
        app: lumo-api
        app.kubernetes.io/name: lumo-api
        app.kubernetes.io/component: api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      serviceAccountName: lumo-api
      containers:
      - name: lumo-api
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/app/lumo", "serve", "--config", "/etc/lumo/config.yaml"]
        env:
        # Database configuration
        - name: LUMO_DATABASE_HOST
          value: {{ if .Values.externalPostgresql.enabled }}{{ .Values.externalPostgresql.host }}{{ else }}"postgres"{{ end }}
        - name: LUMO_DATABASE_PORT
          value: {{ if .Values.externalPostgresql.enabled }}"{{ .Values.externalPostgresql.port }}"{{ else }}"5432"{{ end }}
        - name: LUMO_DATABASE_NAME
          value: {{ if .Values.externalPostgresql.enabled }}{{ .Values.externalPostgresql.database }}{{ else }}"lumo"{{ end }}
        - name: LUMO_DATABASE_USER
          value: {{ if .Values.externalPostgresql.enabled }}{{ .Values.externalPostgresql.username }}{{ else }}"lumo"{{ end }}
        - name: LUMO_DATABASE_PASSWORD
          value: {{ if .Values.externalPostgresql.enabled }}{{ .Values.externalPostgresql.password | quote }}{{ else }}{{ .Values.postgresql.auth.password | quote }}{{ end }}
        - name: LUMO_DATABASE_SSLMODE
          value: {{ if .Values.externalPostgresql.enabled }}{{ .Values.externalPostgresql.sslMode }}{{ else }}"disable"{{ end }}

        # Redis configuration
        - name: LUMO_REDIS_HOST
          value: {{ if .Values.externalRedis.enabled }}{{ .Values.externalRedis.host }}{{ else }}"lumo-redis"{{ end }}
        - name: LUMO_REDIS_PORT
          value: {{ if .Values.externalRedis.enabled }}"{{ .Values.externalRedis.port }}"{{ else }}"6379"{{ end }}
        {{- if .Values.externalRedis.password }}
        - name: LUMO_REDIS_PASSWORD
          value: {{ .Values.externalRedis.password | quote }}
        {{- end }}

        # API server configuration
        - name: LUMO_API_PORT
          value: "8080"
        - name: LUMO_API_HOST
          value: "0.0.0.0"
        - name: LUMO_API_JWT_SECRET
          value: {{ .Values.jwtSecret | quote }}

        # AI configuration
        - name: LUMO_AI_ENABLED
          value: {{ .Values.ai.enabled | quote }}
        - name: LUMO_AI_PROVIDER
          value: {{ .Values.ai.provider }}
        {{- if .Values.ai.keys.anthropic }}
        - name: LUMO_ANTHROPIC_API_KEY
          value: {{ .Values.ai.keys.anthropic | quote }}
        {{- end }}
        {{- if .Values.ai.keys.openai }}
        - name: LUMO_OPENAI_API_KEY
          value: {{ .Values.ai.keys.openai | quote }}
        {{- end }}
        {{- if .Values.ai.keys.gemini }}
        - name: LUMO_GEMINI_API_KEY
          value: {{ .Values.ai.keys.gemini | quote }}
        {{- end }}

        ports:
        - name: http
          containerPort: 8080
          protocol: TCP

        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        startupProbe:
          httpGet:
            path: /api/v1/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12

        resources:
          {{- toYaml .Values.resources | nindent 10 }}

        securityContext:
          {{- toYaml .Values.containerSecurityContext | nindent 10 }}

        volumeMounts:
        - name: config
          mountPath: /etc/lumo
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /var/cache/lumo

      volumes:
      - name: config
        configMap:
          name: lumo-api-config
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
{{- end }}
