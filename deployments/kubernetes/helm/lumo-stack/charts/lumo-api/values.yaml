# Lumo API Server sub-chart values
# These are inherited from parent lumo-stack chart

enabled: true
replicas: 1

image:
  repository: ghcr.io/ignacio/lumo-api
  tag: latest
  pullPolicy: IfNotPresent

jwtSecret: ""  # REQUIRED

migrations:
  enabled: true
  runOnUpgrade: true

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
    - ALL
