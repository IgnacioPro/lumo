# Grafana Helm Chart Values for Lumo Observability
# Install with: helm install grafana grafana/grafana -n monitoring -f values.yaml

# Admin credentials (override in production via secrets)
adminUser: admin
# adminPassword: set via --set adminPassword=xxx or use existing secret

# Use existing secret for admin password (recommended for production)
# admin:
#   existingSecret: grafana-admin-secret
#   userKey: admin-user
#   passwordKey: admin-password

# Persistence for dashboards and settings
persistence:
  enabled: true
  size: 1Gi
  storageClassName: ""  # Use default storage class

# Service configuration
service:
  type: ClusterIP
  port: 80

# Ingress (optional - enable for external access)
ingress:
  enabled: false
  # annotations:
  #   kubernetes.io/ingress.class: nginx
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  # hosts:
  #   - grafana.example.com
  # tls:
  #   - secretName: grafana-tls
  #     hosts:
  #       - grafana.example.com

# Resource limits
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Datasources - Auto-configure Prometheus
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-server.monitoring.svc.cluster.local:80
        access: proxy
        isDefault: true
        editable: false

# Dashboard providers - Load dashboards from ConfigMaps
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: lumo
        orgId: 1
        folder: Lumo
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/lumo

# Dashboard ConfigMaps to load
dashboardsConfigMaps:
  lumo: lumo-grafana-dashboards

# Sidecar for dynamic dashboard loading (alternative to ConfigMaps)
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    folder: /var/lib/grafana/dashboards
    searchNamespace: ALL

# Security context
securityContext:
  runAsNonRoot: true
  runAsUser: 472
  fsGroup: 472

# Pod annotations
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3000"
  prometheus.io/path: "/metrics"

# Grafana configuration
grafana.ini:
  server:
    root_url: "%(protocol)s://%(domain)s/"
  analytics:
    check_for_updates: false
    reporting_enabled: false
  log:
    mode: console
    level: info
  security:
    disable_gravatar: true
