kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lumo-test
nodes:
  - role: control-plane
    # Limit resources for the control plane node
    extraMounts:
      - hostPath: /dev/null
        containerPath: /var/log/journal
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            # Reduce API server resource usage
            max-requests-inflight: "100"
            max-mutating-requests-inflight: "50"
        controllerManager:
          extraArgs:
            # Reduce controller manager resource usage
            concurrent-deployment-syncs: "2"
            concurrent-endpoint-syncs: "2"
            concurrent-service-syncs: "1"
        scheduler:
          extraArgs:
            # Single scheduler thread
            kube-api-qps: "50"
networking:
  # Disable IPv6 to save resources
  ipFamily: ipv4
  # Use default pod and service subnets (smaller ranges)
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
# Disable unnecessary features
featureGates:
  # Disable features you don't need
  EphemeralContainers: false
